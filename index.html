<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Ball: Crash Runner</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
user-select: none;
}

body {
background: #0f172a;
color: #f8fafc;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
overflow: hidden;
}

.game-container {
width: 100%;
max-width: 480px;
height: 100vh;
max-height: 850px;
background: #1e293b;
display: flex;
flex-direction: column;
position: relative;
box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
border: 4px solid #334155;
border-radius: 16px;
overflow: hidden;
}

/* Header / Stats Panel */
.header-panel {
background: #0f172a;
padding: 15px 20px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 2px solid #334155;
z-index: 10;
}

.brand {
font-size: 1.2rem;
font-weight: 800;
color: #38bdf8;
letter-spacing: 1px;
text-transform: uppercase;
}

.balance-box {
background: #1e293b;
padding: 6px 14px;
border-radius: 20px;
border: 1px solid #475569;
font-weight: 700;
font-size: 1.1rem;
color: #fbbf24;
}

/* Canvas Arena */
.arena {
flex: 1;
position: relative;
background: #15803d;
overflow: hidden;
}

canvas {
display: block;
width: 100%;
height: 100%;
}

/* Multiplier & Crash Overlay inside Canvas */
.game-overlay-info {
position: absolute;
top: 20px;
left: 0;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
pointer-events: none;
z-index: 5;
}

.current-multiplier {
font-size: 3.5rem;
font-weight: 900;
color: #ffffff;
text-shadow: 0 4px 10px rgba(0,0,0,0.6);
transition: transform 0.1s ease;
}

.current-multiplier.pulse {
transform: scale(1.15);
color: #4ade80;
}

.game-status-text {
font-size: 1.1rem;
font-weight: 700;
background: rgba(0, 0, 0, 0.5);
padding: 4px 12px;
border-radius: 12px;
margin-top: 5px;
color: #cbd5e1;
}

/* Control Panel / Betting Section */
.control-panel {
background: #0f172a;
padding: 20px;
display: flex;
flex-direction: column;
gap: 12px;
border-top: 2px solid #334155;
z-index: 10;
}

.bet-row {
display: flex;
gap: 10px;
align-items: center;
}

.bet-input-group {
flex: 1;
display: flex;
background: #1e293b;
border: 1px solid #475569;
border-radius: 10px;
overflow: hidden;
}

.bet-input-group span {
padding: 10px 12px;
background: #334155;
color: #94a3b8;
font-weight: bold;
font-size: 0.9rem;
}
